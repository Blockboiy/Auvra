<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#211747" />
    <meta name="robots" content="noindex" />
    <title>Auvra · You're offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8f7fc;color:#211747;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      main{max-width:440px;width:100%;padding:38px 32px;border:1px solid #eae7f2;border-radius:26px;background:white;box-shadow:0 18px 64px #2117470b;text-align:center}
      img{width:80px;height:80px;object-fit:contain}h1{font-size:26px;letter-spacing:-.035em;margin:22px 0 10px}p{font-size:14px;line-height:1.7;color:#77718c;margin:0}
      a{display:inline-block;margin-top:26px;padding:13px 24px;background:#6d35f7;color:white;border-radius:12px;text-decoration:none;font-weight:700;font-size:14px}
      small{display:block;margin-top:24px;color:#77718c;font-size:12px;line-height:1.6}
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Auvra" />
      <h1>You're offline for now.</h1>
      <p>Reconnect to open your Auvra workspace. Missions, wallet balances, and Orbio inference need a live connection.</p>
      <a href="/app">Try again</a>
      <small>Your mission data is not stored in an offline browser cache.</small>
    </main>
  </body>
</html>
